services:
  
  api:
    image: financetracker-api
    container_name: financetracker-api
    build:
        context: .
        dockerfile: Dockerfile
    ports:
        - "5000:8080"
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=${PG_DB};Username=finance-manager;Password=finance-manager
    depends_on:
        db:
            condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: finance-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
        - "5433:5432"
    volumes:
        - dbdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 5s
        timeout: 3s
        retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: financetracker-pgadmin
    depends_on:
        db:
            condition: service_healthy
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
        - "5050:80"

volumes:
  dbdata: